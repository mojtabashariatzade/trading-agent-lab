name: research-ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa:
    name: qa
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate, no persisted credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Protected tests in their own interpreter
        run: python -m unittest tests.test_policy tests.test_store tests.test_controller tests.test_contracts tests.test_providers tests.test_settings tests.test_team tests.test_research -v
      - name: Candidate tests in a separate interpreter
        run: python -m unittest discover -s tests/added -v
      - name: Bytecode compilation
        run: python -m compileall -q agentops trading_lab
# No repository secrets, pull_request_target, self-hosted runner, or deploy step.
